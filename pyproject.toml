[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citesec"
version = "0.1.0"
description = "Citation-grounded RAG over SEC filings, evaluated on FinanceBench"
requires-python = ">=3.11"
dependencies = [
  "pymupdf==1.28.2",
  "pymupdf4llm==1.28.2",
  "edgartools==5.62.0",
  "httpx==0.28.1",
  "pandas==3.0.6",
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "tqdm==4.70.1",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "python-dotenv==1.2.4",
  "RapidFuzz==3.14.6",
  "markdownify==1.2.3",
  "numpy==2.5.4",
  "faiss-cpu==1.15.1",
  "bm25s==0.3.13",
  "sentence-transformers==6.1.0",
  "transformers==5.19.0",
  # torch is installed separately for CUDA, see README:
  # pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/citesec/generation/prompts.py" = ["E501"]  # prompt text reads better unwrapped
"src/citesec/eval/judge.py" = ["E501"]
